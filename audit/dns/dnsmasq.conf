# Logging DNS sinkhole for the egress audit.
#
# Nothing is forwarded upstream, so no lookup ever leaves the machine.
# Every external name resolves to 198.51.100.1, a documentation address
# (RFC 5737). A component that looks up an external host gets an answer,
# tries to connect, and hits the deny-all firewall, so the capture records
# both the hostname it wanted and the connection it attempted.

no-resolv
no-hosts
address=/#/198.51.100.1

log-queries=extra
log-facility=/var/log/dns/dns.log

# Stay root so dnsmasq can write the log into the mounted capture folder.
user=root
